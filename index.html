<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">
        <h1 class="text-center mb-2">Task Manager</h1>

        <button id="darkModeBtn" class="btn btn-dark mb-3">
            🌙 Dark Mode
        </button>

        <p class="text-center text-muted mb-5">
            Organize your day, one task at a time.
        </p>

        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h5 mb-3">My Tasks</h2>


                <div class="row g-2 mb-3">
                    <div class="col-12">
                        <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task...">
                    </div>

                    <div class="col-6">
                        <label for="taskDueDate" class="form-label">
                            Due Date
                        </label>
                        <input type="date" id="taskDueDate" class="form-control">
                    </div>

                    <div class="col-6">
                        <label for="taskPriority" class="form-label">
                            Priority
                        </label>
                        <select id="taskPriority" class="form-select">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label for="taskCategory" class="form-label">
                            Category
                        </label>

                        <select id="taskCategory" class="form-select">
                            <option value="Study">📚 Study</option>
                            <option value="Work">💼 Work</option>
                            <option value="Personal">🏠 Personal</option>
                            <option value="Other">📌 Other</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <button id="addTaskBtn" class="btn btn-primary w-100">
                            Add Task
                        </button>

                        <button id="cancelEditBtn" class="btn btn-secondary w-100 mt-2" type="button"
                            style="display: none;">
                            Cancel Edit
                        </button>

                    </div>

                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between mb-2">
                        <label for="progressBar" class="form-label mb-0">
                            Your Progress
                        </label>
                        <span id="progressText">0%</span>
                    </div>

                    <div class="progress" role="progressbar" aria-label="Task completion progress" aria-valuemin="0"
                        aria-valuemax="100" aria-valuenow="0" id="progressContainer">
                        <div id="progressBar" class="progress-bar bg-success" style="width: 0%"></div>
                    </div>

                    <div class="card p-3 mb-4">
                        <h5 class="mb-3">📊 Progress by Priority</h5>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <span>High Priority</span>
                                <span id="highPriorityText">0%</span>
                            </div>
                            <div class="progress">
                                <div id="highPriorityBar" class="progress-bar bg-danger" style="width: 0%"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <span>Medium Priority</span>
                                <span id="mediumPriorityText">0%</span>
                            </div>
                            <div class="progress">
                                <div id="mediumPriorityBar" class="progress-bar bg-warning" style="width: 0%"></div>
                            </div>
                        </div>

                        <div>
                            <div class="d-flex justify-content-between">
                                <span>Low Priority</span>
                                <span id="lowPriorityText">0%</span>
                            </div>
                            <div class="progress">
                                <div id="lowPriorityBar" class="progress-bar bg-success" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                </div>


                <div class="mb-3">
                    <label for="taskFilter" class="form-label">
                        Filter Tasks
                    </label>

                    <select id="taskFilter" class="form-select">
                        <option value="all">All Tasks</option>
                        <option value="active">Active Tasks</option>
                        <option value="completed">Completed Tasks</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="taskSort" class="form-label">
                        Sort Tasks By
                    </label>

                    <select id="taskSort" class="form-select">
                        <option value="priority">Priority</option>
                        <option value="date">Due Date</option>
                        <option value="newest">Newest First</option>
                    </select>
                </div>



                <div class="mb-3">
                    <label for="taskSearch" class="form-label">
                        Search Tasks
                    </label>

                    <input type="search" id="taskSearch" class="form-control" placeholder="Search by task name...">
                </div>


                <div class="row g-2 mb-4">
                    <div class="col-6 col-md-3">
                        <div class="card text-center p-2">
                            <h3 id="totalTasks">0</h3>
                            <small>Total Tasks</small>
                        </div>
                    </div>

                    <div class="col-6 col-md-3">
                        <div class="card text-center p-2">
                            <h3 id="completedTasks">0</h3>
                            <small>Completed</small>
                        </div>
                    </div>

                    <div class="col-6 col-md-3">
                        <div class="card text-center p-2">
                            <h3 id="remainingTasks">0</h3>
                            <small>Remaining</small>
                        </div>
                    </div>

                    <div class="col-6 col-md-3">
                        <div class="card text-center p-2">
                            <h3 id="overdueTasks" class="text-danger">0</h3>
                            <small>Overdue</small>
                        </div>
                    </div>

                </div>


                <ul id="taskList" class="list-group">
                    <!-- Tasks will appear here -->
                </ul>

                <div class="task-tools">
                    <button id="clearCompletedBtn" class="btn btn-outline-danger">
                        <span>🗑️</span> Clear Completed Tasks
                    </button>

                    <button id="exportTasksBtn" class="btn btn-primary">
                        <span>📥</span> Export Tasks
                    </button>

                    <label for="importTasksInput" class="file-picker">
                        <span>📂</span>
                        <span id="filePickerText">Choose JSON file</span>
                    </label>

                    <input type="file" id="importTasksInput" accept=".json,application/json" class="visually-hidden" />

                    <button id="importTasksBtn" class="btn btn-success">
                        <span>📤</span> Import Tasks
                    </button>
                </div>

                <p id="emptyMessage" class="text-muted text-center mt-3 mb-0">
                    No tasks yet. Add your first task!
                </p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
